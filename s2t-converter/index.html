<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>简繁转换器 · 简体 ⇄ 繁体</title>
<style>
  :root {
    --bg1: #f7f3ec;
    --bg2: #eaf0f6;
    --card: #ffffff;
    --ink: #2b2f36;
    --muted: #8a8f98;
    --accent: #c0392b;
    --accent-soft: #fbeae7;
    --accent-deep: #9c2c20;
    --border: #e7e2d8;
    --line: #eee9df;
    --shadow: 0 18px 48px -18px rgba(60, 50, 40, 0.28);
    --radius: 20px;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    --serif: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 18px 64px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 980px;
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    justify-content: center;
  }
  .brand .glyphs {
    display: inline-flex;
    align-items: center;
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
  }
  .brand .g-s { color: var(--accent); }
  .brand .g-arrow { color: var(--muted); font-size: 22px; margin: 0 2px; }
  .brand .g-t { color: var(--ink); }
  h1 {
    font-family: var(--serif);
    font-size: 30px;
    letter-spacing: 4px;
    margin: 0;
    font-weight: 700;
  }
  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .segment {
    display: inline-flex;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 4px 14px -8px rgba(0,0,0,0.2);
  }
  .segment button {
    border: 0;
    background: transparent;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    padding: 9px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .2s ease;
    white-space: nowrap;
  }
  .segment button.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 6px 16px -6px rgba(192,57,43,.6);
  }
  .segment button:not(.active):hover { color: var(--ink); }

  .variant {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px 6px 16px;
    box-shadow: 0 4px 14px -8px rgba(0,0,0,0.2);
  }
  .variant label { font-size: 13px; color: var(--muted); }
  .variant select {
    border: 0;
    background: transparent;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    outline: none;
    padding: 4px 2px;
  }

  /* ---------- Panels ---------- */
  .panels {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    align-items: stretch;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 320px;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #fffdfa, #fbf8f2);
  }
  .panel-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
  }
  .count { font-size: 12px; color: var(--muted); }

  textarea {
    flex: 1;
    border: 0;
    resize: none;
    outline: none;
    padding: 18px;
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.9;
    color: var(--ink);
    background: transparent;
    min-height: 280px;
  }
  #result {
    background: #fcfbf8;
  }
  .placeholder-hint { color: var(--muted); }

  /* center swap */
  .center-col {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .swap-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .25s ease, background .2s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .swap-btn:hover { transform: rotate(180deg); background: var(--accent-soft); }

  /* ---------- Action bar ---------- */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 22px;
  }
  .btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 12px;
    cursor: pointer;
    transition: all .18s ease;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-deep); color: #fff; }
  .btn:active { transform: translateY(0); }

  /* status */
  .status {
    text-align: center;
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 18px;
    letter-spacing: .3px;
  }
  .status.error { color: var(--accent); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all .28s ease;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,.5);
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }

  @media (max-width: 720px) {
    .panels { grid-template-columns: 1fr; }
    .center-col { order: 2; }
    .swap-btn { transform: rotate(90deg); }
    .swap-btn:hover { transform: rotate(270deg); }
    h1 { font-size: 24px; letter-spacing: 2px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="glyphs"><span class="g-s">简</span><span class="g-arrow">⇄</span><span class="g-t">繁</span></span>
      </div>
      <h1>简繁转换器</h1>
      <div class="subtitle">简体 ⇄ 繁体 · 标准 / 台湾 / 香港 一键切换</div>
    </header>

    <div class="controls">
      <div class="segment" id="dirSeg">
        <button data-dir="s2t" class="active">简体 → 繁体</button>
        <button data-dir="t2s">繁体 → 简体</button>
      </div>
      <div class="variant">
        <label id="variantLabel">目标变体</label>
        <select id="variantSel">
          <option value="tw">台湾繁体（推荐）</option>
          <option value="t">标准繁体</option>
          <option value="hk">香港繁体</option>
        </select>
      </div>
    </div>

    <div class="panels">
      <section class="panel">
        <div class="panel-head">
          <span class="panel-title"><span class="dot"></span><span id="srcTitle">简体原文</span></span>
          <span class="count"><span id="srcCount">0</span> 字</span>
        </div>
        <textarea id="input" placeholder="在此输入简体文字，右侧实时显示繁体结果…" spellcheck="false"></textarea>
      </section>

      <div class="center-col">
        <button class="swap-btn" id="swapBtn" title="互换内容与方向">⇄</button>
      </div>

      <section class="panel">
        <div class="panel-head">
          <span class="panel-title"><span class="dot"></span><span id="dstTitle">繁体结果</span></span>
          <span class="count"><span id="dstCount">0</span> 字</span>
        </div>
        <textarea id="result" placeholder="转换结果将显示在这里…" readonly spellcheck="false"></textarea>
      </section>
    </div>

    <div class="actions">
      <button class="btn primary" id="copyBtn">复制结果</button>
      <button class="btn" id="clearBtn">清空</button>
      <button class="btn" id="sampleBtn">载入示例</button>
    </div>

    <div class="status" id="status">正在加载转换引擎…</div>

    <footer>
      转换引擎由 <a href="https://github.com/BYVoid/OpenCC" target="_blank" rel="noopener">OpenCC</a> 提供，首次使用需联网加载词库。
    </footer>
  </div>

  <div class="toast" id="toast">已复制到剪贴板</div>

<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.4.1/dist/umd/full.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const input = $('input');
  const result = $('result');
  const status = $('status');
  const toast = $('toast');

  const state = { dir: 's2t', variant: 'tw' };
  let OpenCC = null;
  const convCache = new Map();

  async function ensureLib() {
    if (typeof OpenCC !== 'undefined' && OpenCC) return OpenCC;
    if (typeof window.OpenCC !== 'undefined' && window.OpenCC) { OpenCC = window.OpenCC; return OpenCC; }
    throw new Error('OpenCC not loaded');
  }

  function getConverter() {
    const lib = (typeof OpenCC !== 'undefined' && OpenCC) ? OpenCC : window.OpenCC;
    const { dir, variant } = state;
    const from = dir === 's2t' ? 'cn' : variant;
    const to   = dir === 's2t' ? variant : 'cn';
    const key = from + '>' + to;
    if (!convCache.has(key)) {
      convCache.set(key, lib.Converter({ from, to }));
    }
    return convCache.get(key);
  }

  let converting = false;
  async function convert() {
    const text = input.value;
    $('srcCount').textContent = [...text].length;
    if (!text.trim()) {
      result.value = '';
      $('dstCount').textContent = '0';
      status.textContent = '转换引擎就绪';
      return;
    }
    if (converting) return;
    converting = true;
    try {
      await ensureLib();
      const conv = getConverter();
      result.value = conv(text);
      $('dstCount').textContent = [...result.value].length;
      status.textContent = '转换引擎就绪';
      status.classList.remove('error');
    } catch (e) {
      status.textContent = '加载失败：请检查网络后刷新页面（首次使用需联网）。';
      status.classList.add('error');
    } finally {
      converting = false;
    }
  }

  // debounce typing
  let t = null;
  input.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(convert, 180);
  });

  function updateLabels() {
    const s2t = state.dir === 's2t';
    $('srcTitle').textContent = s2t ? '简体原文' : '繁体原文';
    $('dstTitle').textContent = s2t ? '繁体结果' : '简体结果';
    $('variantLabel').textContent = s2t ? '目标变体' : '来源变体';
    input.placeholder = s2t ? '在此输入简体文字，右侧实时显示繁体结果…' : '在此输入繁体文字，右侧实时显示简体结果…';
    result.placeholder = s2t ? '转换结果将显示在这里…' : '转换结果将显示在这里…';
    document.querySelectorAll('#dirSeg button').forEach(b => {
      b.classList.toggle('active', b.dataset.dir === state.dir);
    });
  }

  document.querySelectorAll('#dirSeg button').forEach(b => {
    b.addEventListener('click', () => {
      state.dir = b.dataset.dir;
      updateLabels();
      convert();
    });
  });

  $('variantSel').addEventListener('change', (e) => {
    state.variant = e.target.value;
    convert();
  });

  $('copyBtn').addEventListener('click', async () => {
    if (!result.value) { showToast('没有可复制的内容'); return; }
    try {
      await navigator.clipboard.writeText(result.value);
      showToast('已复制到剪贴板');
    } catch {
      result.select();
      document.execCommand('copy');
      showToast('已复制到剪贴板');
    }
  });

  $('clearBtn').addEventListener('click', () => {
    input.value = '';
    result.value = '';
    $('srcCount').textContent = '0';
    $('dstCount').textContent = '0';
    input.focus();
  });

  $('swapBtn').addEventListener('click', () => {
    // move result to input, reverse direction
    const out = result.value;
    state.dir = state.dir === 's2t' ? 't2s' : 's2t';
    updateLabels();
    input.value = out;
    convert();
  });

  $('sampleBtn').addEventListener('click', () => {
    state.dir = 's2t';
    updateLabels();
    input.value = '这是一只可爱的小猫，它喜欢吃鱼和牛奶。\n春风又绿江南岸，明月何时照我还。\n我们致力于为用户提供简单而优雅的产品体验。';
    convert();
  });

  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  // init
  updateLabels();
  convert();
</script>
</body>
</html>
